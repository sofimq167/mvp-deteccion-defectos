# Servidor web y proxy inverso.
#
# Es el unico punto de entrada del sistema (ADR-04): entrega los archivos
# estaticos de la aplicacion al navegador y reenvia al servicio de analisis
# las peticiones dirigidas a /api. El servicio escucha solo en la red
# interna de contenedores y no publica puerto al exterior (RNF-07).

server {
    listen 80;
    server_name _;

    # El limite de tamano se aplica aqui, antes de reenviar nada: una carga
    # excesiva se rechaza sin llegar a consumir el computo del servicio.
    client_max_body_size 210M;

    # Cabeceras de endurecimiento basicas.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # --- aplicacion web (SPA) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- reenvio al servicio de analisis ---
    location /api/ {
        proxy_pass http://servicio:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # El analisis de una pista larga puede tardar; sin estos margenes
        # nginx cortaria la conexion antes de que el servicio responda.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
